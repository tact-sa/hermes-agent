# Tact managed (administrator-pinned) config. The Dockerfile copies this file to
# /etc/hermes/config.yaml, which Hermes reads automatically as its managed scope. Its values
# overlay the user's config.yaml and cannot be changed from inside the bot.
# Lists replace, they do not merge: every entry you want must be listed here.

# Plugins: tact-guard requires a human Approve/Deny before the browser submits anything,
# refuses typing into password/OTP/card/ID fields, and blocks in-page scripts.
# tact-meetings logs meetings and sends an advance reminder 10 minutes before and a reminder at start.
# tact-consult answers "/consult <question>" as an executive strategy consultant (only when typed).
# tact-recorder turns a meeting recording the manager sends into a transcript, a brief and a task
# list that goes back to the manager only, for confirmation (/recordings, /brief <id>).
# tact-clock tells the model the real current date and time (Riyadh) on every turn.
plugins:
  enabled:
    - tact-guard
    - tact-meetings
    - tact-consult
    - tact-recorder
    - tact-clock
  # Lets tact-recorder send the meeting brief to the model named in tact_recorder.brief_model
  # (below); no other plugin and no chat turn is affected.
  entries:
    tact-recorder:
      llm:
        allow_model_override: true

# The manager works in Riyadh: reminders, meeting times and "now" are all Riyadh time.
timezone: Asia/Riyadh

# Scheduled messages (reminders, meeting advance reminders) arrive as plain messages, without the
# "Cronjob Response: <job>" header and the "to stop this job" footer.
cron:
  wrap_response: false

agent:
  # Toolsets a secretary bot does not need. Each one is a way to run code, touch files, reach
  # other accounts or devices, or spend money without passing through tact-guard.
  # "browser" is deliberately kept enabled so the bot can open links and make bookings.
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - computer_use
    - delegation
    - connections
    - desktop_ui
    - project
    - kanban
    - homeassistant
    - spotify
    - image_gen
    - video_gen

# Voice notes: transcribed by Groq Whisper using GROQ_API_KEY (set in Railway). The provider is
# pinned because auto-detection does not reliably pick Groq. language is left empty so Whisper
# auto-detects each note and both English and Arabic work: Hermes's built-in default is "en",
# which would force Arabic notes through English decoding.
stt:
  enabled: true
  provider: groq
  language: ""

# Meeting briefs (tact-recorder) only: written by Gemini Flash on OpenRouter, which follows the
# brief's JSON shape reliably where the chat model did not (broken JSON, lost deadlines, tasks filed
# as decisions). Chat, reminders and /consult stay on the main model. If this model fails, the brief
# falls back to the main model for that meeting.
tact_recorder:
  brief_model: google/gemini-3.8-flash

# Approvals: always ask the manager in chat; scheduled (cron) jobs have nobody to ask, so any
# action that needs approval is refused there instead of being auto-approved.
approvals:
  mode: manual
  cron_mode: deny

# Security: mask API keys and tokens in tool output before the model or the chat sees them.
security:
  redact_secrets: true
