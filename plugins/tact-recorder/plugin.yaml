name: tact-recorder
version: "0.1.0"
description: "Meeting recorder: the manager sends a meeting recording (audio file, audio document or long voice note) in a private chat; it is transcribed with the configured STT provider, summarised into a brief (summary, decisions, open issues) and a task list per person, and the tasks go back to the manager ONLY for confirmation (buttons on Telegram, or text replies). /recordings lists recent meetings, /brief <id> re-shows one."
author: "Tact"
provides_hooks:
  - pre_gateway_dispatch
